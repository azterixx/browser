<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Downloads</title>
  <link rel="stylesheet" href="settings.css">
  <style>
    body { display: block; height: auto; }
    header { grid-template-columns: 256px 1fr 256px; height: 56px; }
    header .end { justify-self: end; }
    main { max-width: 680px; margin: 0 auto; padding: 8px 24px 64px; overflow: visible; }
    .dl { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 20px; border-top: 1px solid var(--line); }
    .dl:first-child { border-top: 0; }
    .dl .ico { flex: none; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--field); color: var(--dim); }
    .dl .ico svg { width: 18px; height: 18px; }
    .dl .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .dl .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .dl button.name { all: unset; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--accent); }
    .dl button.name:hover { text-decoration: underline; }
    .dl small { color: var(--dim); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .dl.gone .name { text-decoration: line-through; color: var(--dim); }
    .dl.active .ico svg { animation: pulse .9s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .empty { padding: 40px 20px; text-align: center; color: var(--dim); }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-icon"></span>Downloads</div>
    <label class="search">
      <span class="search-icon"></span>
      <input id="search" placeholder="Search downloads" spellcheck="false" autocomplete="off">
    </label>
    <span class="end"><button id="clear" class="btn">Clear list</button></span>
  </header>
  <main>
    <div id="list" class="card"></div>
  </main>
  <script src="downloads.js"></script>
</body>
</html>
